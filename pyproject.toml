[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "retop-hmn"
version = "0.7.0"
description = "Helix Memory Network — reversible coupling + MoE + episodic memory language model (CPU-trainable)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.0",
    "tokenizers>=0.13",
]

[project.optional-dependencies]
gui = ["gradio>=4"]
exps = ["matplotlib", "numpy"]
hf = ["transformers>=4.40", "accelerate>=0.30", "datasets>=2.19"]
scale = ["triton>=3.0", "deepspeed>=0.14"]

[project.scripts]
retop = "retop:main"
retop-infer = "infer:main"
retop-gui = "retop_gui:main"

[tool.setuptools]
packages = ["hmn"]
py-modules = ["infer", "retop", "train_v3", "gen_slots", "gen_chat", "retop_gui"]
