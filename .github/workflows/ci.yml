name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install tokenizers
          pip install -e .

      - name: Model-level tests
        run: python test_hmn.py

      - name: M1 sparse-marginal parity
        run: python experiments/v4/m1_sparse_parity.py

      - name: v3.3 seed-42 guardrail (40/40 exact)
        run: python experiments/verified/slot_v33_seed42.py

      - name: v4 slot guardrail (stem-addr + pos_eos matrix)
        run: python experiments/verified/slot_v4.py 60

      - name: v4 chain guardrail (pos_eos, 5 seeds + 3-slot length-gen)
        run: python experiments/verified/chain_v4.py 60

      - name: Download v5 checkpoint (release asset)
        run: |
          curl -sL https://github.com/arena11a/ReTop/releases/download/v5/omega_cur2.pt -o omega_cur2.pt
          ls -la omega_cur2.pt

      - name: v5 seam smoke (M1 plumbing regression, 10 steps)
        run: python experiments/v5/omega_seam.py --skip-m0 --skip-regression --steps 10 --eval-every 10 --save /tmp/omega_ci_smoke.pt

      - name: v5 M3 generalization probes (rotation/held-out/len-gen, must be 20/20)
        run: python experiments/v5/m3_generalization.py --checkpoint omega_cur2.pt --suite cur --n 20

      - name: v5 M4 skill library (distill/retrieve/execute)
        run: python experiments/v5/m4_skills.py --checkpoint omega_cur2.pt --n 5